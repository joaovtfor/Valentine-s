
services:
  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Helps with Webpack hot-reload on Windows Docker Desktop
      - CHOKIDAR_USEPOLLING=true # Helps with Chokidar/Turbopack polling
